openapi: 3.0.3
info:
  title: Task Manager API
  description: Secure Task Manager REST API with JWT access/refresh token rotation and object-level authorization.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Validation error
        "409":
          description: Email already in use

  /auth/login:
    post:
      summary: Sign in with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Authenticated successfully
        "401":
          description: Invalid email or password

  /auth/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        "200":
          description: New token pair issued
        "401":
          description: Invalid, expired, or reused refresh token

  /auth/logout:
    post:
      summary: Revoke refresh token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "204":
          description: Session revoked

  /auth/logout-all:
    post:
      summary: Revoke all refresh tokens for authenticated user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All sessions revoked
        "401":
          description: Unauthenticated

  /tasks:
    get:
      summary: List current user's tasks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Current user's paginated tasks
        "401":
          description: Missing or invalid access token
    post:
      summary: Create a new task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Task created
        "400":
          description: Validation error
        "401":
          description: Unauthenticated

  /tasks/{taskId}:
    patch:
      summary: Update a task owned by user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
                  maxLength: 2000
                  nullable: true
                completed:
                  type: boolean
      responses:
        "200":
          description: Task updated
        "401":
          description: Unauthenticated
        "404":
          description: Task not found or not owned
    delete:
      summary: Delete a task owned by user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Task deleted
        "401":
          description: Unauthenticated
        "404":
          description: Task not found or not owned

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
